# docker/docker-compose.external.yml — DeskRPG + PostgreSQL
services:
  deskrpg-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deskrpg
      POSTGRES_USER: deskrpg
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Easypanel}"
    volumes:
      - deskrpg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskrpg -d deskrpg"]
      interval: 5s
      timeout: 5s
      retries: 5

  deskrpg-app:
    image: ${DESKRPG_IMAGE:-ghcr.io/dandacompany/deskrpg:latest}
    restart: unless-stopped
    volumes:
      - ../public/assets:/app/public/assets
      - deskrpg-users:/var/deskrpg/users
      - deskrpg-workspaces:/var/deskrpg/workspaces
    # Pin the Hermes gateway running on the host (default 8642) by name.
    # The bridge gateway IP changes when the network is recreated, so do not use the IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_TYPE: postgresql
      DATABASE_URL: "postgresql://deskrpg:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Easypanel}@deskrpg-db:5432/deskrpg"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in Easypanel}"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INTERNAL_HOSTNAME: 0.0.0.0
    depends_on:
      deskrpg-db:
        condition: service_healthy

volumes:
  deskrpg-pgdata:
  deskrpg-users:
  deskrpg-workspaces:
